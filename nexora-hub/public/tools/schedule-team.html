<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Schedule — Test Management</title>
<style>
:root{
  --bg:#0b0f17;--panel:#111726;--p2:#0f1420;
  --border:#1e2840;--text:#e7ebf3;--dim:#6b7693;
  --accent:#5b8cff;--free:#35d08f;--pro:#ff9f43;--danger:#ff5a6e;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.nav{display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10}
.nav-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.nav-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 8px var(--accent)}
.nav-back{color:var(--dim);font-size:12px;text-decoration:none;
  padding:5px 11px;border:1px solid var(--border);border-radius:8px;
  transition:color .15s,border-color .15s}
.nav-back:hover{color:var(--text);border-color:var(--accent)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 20px 40px}

/* KPI */
.kpi-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.kpi{flex:1;min-width:130px;background:var(--p2);border:1px solid var(--border);
  border-radius:var(--r);padding:14px 16px}
.kpi-val{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi-lbl{font-size:11px;color:var(--dim);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.green{color:var(--free)}.orange{color:var(--pro)}.red{color:var(--danger)}.blue{color:var(--accent)}

/* Tabs */
.tabs{display:flex;gap:2px;background:var(--p2);padding:4px;border-radius:11px;
  margin-bottom:16px;border:1px solid var(--border)}
.tab{flex:1;text-align:center;padding:8px 10px;border-radius:9px;
  font-size:12.5px;font-weight:600;cursor:pointer;transition:background .15s,color .15s;
  color:var(--dim);border:none;background:none;font-family:inherit}
.tab.active{background:var(--panel);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* Section */
.section{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:18px;margin-bottom:16px}
h2{font-size:15px;font-weight:600;margin-bottom:14px}

/* Task list */
.task-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--border)}
.task-item:last-child{border-bottom:none}
.task-check{width:18px;height:18px;border:2px solid var(--border);border-radius:5px;
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  margin-top:2px;transition:background .15s,border-color .15s}
.task-check.done{background:var(--free);border-color:var(--free)}
.task-check.done::after{content:'✓';font-size:11px;color:#fff;font-weight:700}
.task-body{flex:1;min-width:0}
.task-title{font-size:13px;font-weight:500;line-height:1.4}
.task-title.done{text-decoration:line-through;color:var(--dim)}
.task-meta{display:flex;gap:7px;margin-top:5px;flex-wrap:wrap;align-items:center}
.badge{font-size:10px;padding:2px 7px;border-radius:999px;font-weight:600;
  text-transform:uppercase;letter-spacing:.3px;border:1px solid transparent}
.b-critical{background:rgba(255,90,110,.12);color:var(--danger);border-color:rgba(255,90,110,.25)}
.b-high    {background:rgba(255,159,67,.12);color:var(--pro);border-color:rgba(255,159,67,.25)}
.b-medium  {background:rgba(91,140,255,.12);color:var(--accent);border-color:rgba(91,140,255,.25)}
.b-low     {background:rgba(53,208,143,.1);color:var(--free);border-color:rgba(53,208,143,.2)}
.b-pass    {background:rgba(53,208,143,.12);color:var(--free);border-color:rgba(53,208,143,.25)}
.b-fail    {background:rgba(255,90,110,.12);color:var(--danger);border-color:rgba(255,90,110,.25)}
.b-pend    {background:rgba(107,118,147,.1);color:var(--dim);border-color:var(--border)}
.assign{font-size:11px;color:var(--dim)}

/* Sprint progress */
.sprint-bar{background:var(--p2);border-radius:999px;height:8px;overflow:hidden;margin:8px 0}
.sprint-fill{height:100%;border-radius:999px;background:var(--accent);transition:width .4s}
.sprint-info{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}

/* Add form */
.add-form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end}
.add-form input,.add-form select{background:var(--p2);border:1px solid var(--border);
  border-radius:9px;color:var(--text);padding:8px 11px;font-size:13px;font-family:inherit}
.add-form input{flex:1;min-width:180px}
.add-form input:focus,.add-form select:focus{outline:none;border-color:var(--accent)}
.btn{padding:8px 14px;border-radius:9px;border:1px solid var(--border);
  background:var(--p2);color:var(--text);font-size:12.5px;font-family:inherit;
  cursor:pointer;transition:border-color .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn-primary:hover{opacity:.88;color:#fff}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-danger{border-color:rgba(255,90,110,.3);color:var(--danger)}
.btn-danger:hover{background:rgba(255,90,110,.1);border-color:var(--danger)}

/* Test cases */
.test-row{display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--border);font-size:12.5px}
.test-row:last-child{border-bottom:none}
.test-id{font-size:11px;color:var(--dim);min-width:50px;font-variant-numeric:tabular-nums}
.test-name{flex:1}
.test-result select{background:var(--p2);border:1px solid var(--border);border-radius:7px;
  color:var(--text);padding:4px 7px;font-size:11.5px;font-family:inherit;cursor:pointer}
.test-result select:focus{outline:none;border-color:var(--accent)}

/* Empty state */
.empty{text-align:center;padding:32px 16px;color:var(--dim);font-size:13px}

[hidden]{display:none!important}

.view{display:none}
.view.active{display:block}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">
    <span class="nav-dot"></span>
    Schedule — Test Management
  </div>
  <a class="nav-back" href="javascript:history.back()">← NEXORA</a>
</nav>

<div class="wrap">

  <!-- KPIs -->
  <div class="kpi-row">
    <div class="kpi"><div class="kpi-val blue"  id="kpiTotal">0</div><div class="kpi-lbl">Tâches totales</div></div>
    <div class="kpi"><div class="kpi-val green"  id="kpiDone">0</div><div class="kpi-lbl">Terminées</div></div>
    <div class="kpi"><div class="kpi-val orange" id="kpiPending">0</div><div class="kpi-lbl">En cours</div></div>
    <div class="kpi"><div class="kpi-val green"  id="kpiPassRate">—</div><div class="kpi-lbl">Tests passés</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('tasks',this)">📋 Tâches Sprint</button>
    <button class="tab"        onclick="switchTab('tests',this)">🧪 Cas de test</button>
    <button class="tab"        onclick="switchTab('sprint',this)">📊 Sprint Board</button>
  </div>

  <!-- ── VIEW: TASKS ── -->
  <div class="view active" id="viewTasks">
    <div class="section">
      <div class="add-form">
        <input id="addTitle" placeholder="Nouvelle tâche…"/>
        <select id="addPrio">
          <option value="medium">Moyen</option>
          <option value="high">Élevé</option>
          <option value="critical">Critique</option>
          <option value="low">Bas</option>
        </select>
        <select id="addAssign">
          <option value="FA">Fatima</option>
          <option value="LV">Lars</option>
          <option value="PS">Priya</option>
          <option value="DK">Daan</option>
          <option value="MJ">Mia</option>
        </select>
        <button class="btn btn-primary" onclick="addTask()">+ Ajouter</button>
      </div>
      <div id="taskList"></div>
    </div>
  </div>

  <!-- ── VIEW: TESTS ── -->
  <div class="view" id="viewTests">
    <div class="section">
      <div class="add-form">
        <input id="addTestName" placeholder="Nom du cas de test…"/>
        <select id="addTestMod">
          <option>Module Auth</option>
          <option>Module Planning</option>
          <option>Module Rapports</option>
          <option>Module API</option>
          <option>Intégration</option>
        </select>
        <button class="btn btn-primary" onclick="addTest()">+ Ajouter</button>
      </div>
      <div id="testList"></div>
    </div>
  </div>

  <!-- ── VIEW: SPRINT ── -->
  <div class="view" id="viewSprint">
    <div class="section">
      <h2>Sprint courant</h2>
      <div class="sprint-info">
        <span id="sprintLabel">Sprint — calcul…</span>
        <span id="sprintPct">0%</span>
      </div>
      <div class="sprint-bar"><div class="sprint-fill" id="sprintFill" style="width:0"></div></div>
      <div style="margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px" id="boardCols"></div>
    </div>
  </div>

</div>

<script>
const SKEY = 'nexora_schedule_v2';
let state = {tasks:[], tests:[]};
try{ state = JSON.parse(localStorage.getItem(SKEY)||'{}'); }catch(e){}
if(!state.tasks) state.tasks=[];
if(!state.tests)  state.tests=[];

// Seed default data if empty
if(state.tasks.length===0){
  state.tasks=[
    {id:1,title:'Configurer pipeline CI/CD pour nexora-hub',prio:'high',assign:'LV',done:true},
    {id:2,title:'Mettre à jour le planning Utrecht semaine 46',prio:'critical',assign:'FA',done:false},
    {id:3,title:'Revue du code module schedule-team',prio:'medium',assign:'PS',done:false},
    {id:4,title:'Corriger le bug NaN sur le widget router',prio:'critical',assign:'DK',done:true},
    {id:5,title:'Documenter les routes API /tools/*',prio:'low',assign:'MJ',done:false},
    {id:6,title:'Test de charge Docker compose VPS',prio:'high',assign:'LV',done:false},
  ];
}
if(state.tests.length===0){
  state.tests=[
    {id:'TC-01',name:'Login avec credentials valides',module:'Module Auth',result:'pass'},
    {id:'TC-02',name:'Redirection après logout',module:'Module Auth',result:'pass'},
    {id:'TC-03',name:'Affichage planning semaine courante',module:'Module Planning',result:'fail'},
    {id:'TC-04',name:'Verrouillage de slot équipe',module:'Module Planning',result:'pending'},
    {id:'TC-05',name:'Génération rapport CSV',module:'Module Rapports',result:'pass'},
    {id:'TC-06',name:'Endpoint GET /api/widgets/team 200',module:'Module API',result:'pending'},
    {id:'TC-07',name:'Endpoint POST /api/chat streaming',module:'Module API',result:'pass'},
  ];
}

function save(){try{localStorage.setItem(SKEY,JSON.stringify(state));}catch(e){}}

const PRIO_CLS={critical:'b-critical',high:'b-high',medium:'b-medium',low:'b-low'};
const PRIO_LBL={critical:'Critique',high:'Élevé',medium:'Moyen',low:'Bas'};
const NAMES={FA:'Fatima',LV:'Lars',PS:'Priya',DK:'Daan',MJ:'Mia'};

function switchTab(id, btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('view'+id.charAt(0).toUpperCase()+id.slice(1)).classList.add('active');
  btn.classList.add('active');
  renderAll();
}

function renderTasks(){
  const el=document.getElementById('taskList');
  if(!state.tasks.length){el.innerHTML='<div class="empty">Aucune tâche. Ajoutez-en ci-dessus.</div>';return;}
  el.innerHTML=state.tasks.map(t=>`
    <div class="task-item">
      <div class="task-check ${t.done?'done':''}" onclick="toggleTask(${t.id})"></div>
      <div class="task-body">
        <div class="task-title ${t.done?'done':''}">${esc(t.title)}</div>
        <div class="task-meta">
          <span class="badge ${PRIO_CLS[t.prio]}">${PRIO_LBL[t.prio]}</span>
          <span class="assign">👤 ${NAMES[t.assign]||t.assign}</span>
        </div>
      </div>
      <button class="btn btn-sm btn-danger" onclick="deleteTask(${t.id})">✕</button>
    </div>`).join('');
}

function renderTests(){
  const el=document.getElementById('testList');
  if(!state.tests.length){el.innerHTML='<div class="empty">Aucun cas de test.</div>';return;}
  el.innerHTML=state.tests.map((t,i)=>`
    <div class="test-row">
      <span class="test-id">${t.id}</span>
      <div style="flex:1;min-width:0">
        <div class="test-name">${esc(t.name)}</div>
        <div style="font-size:11px;color:var(--dim);margin-top:2px">${esc(t.module)}</div>
      </div>
      <div class="test-result">
        <select onchange="setTestResult(${i},this.value)">
          <option value="pending"  ${t.result==='pending' ?'selected':''}>⏳ En attente</option>
          <option value="pass"     ${t.result==='pass'    ?'selected':''}>✅ Passé</option>
          <option value="fail"     ${t.result==='fail'    ?'selected':''}>❌ Échoué</option>
        </select>
      </div>
      <span class="badge ${t.result==='pass'?'b-pass':t.result==='fail'?'b-fail':'b-pend'}" style="margin-left:7px">
        ${t.result==='pass'?'PASS':t.result==='fail'?'FAIL':'PEND'}
      </span>
    </div>`).join('');
}

function renderSprint(){
  const done=state.tasks.filter(t=>t.done).length;
  const total=state.tasks.length;
  const pct=total?Math.round(done/total*100):0;
  const now=new Date();
  const sprintNum=Math.ceil((now - new Date(now.getFullYear(),0,1))/(7*86400000));
  document.getElementById('sprintLabel').textContent=`Sprint ${sprintNum} · ${done}/${total} tâches`;
  document.getElementById('sprintPct').textContent=pct+'%';
  document.getElementById('sprintFill').style.width=pct+'%';

  const cols={todo:[],inprogress:[],done:[]};
  state.tasks.forEach(t=>{
    if(t.done) cols.done.push(t);
    else if(t.prio==='critical'||t.prio==='high') cols.inprogress.push(t);
    else cols.todo.push(t);
  });
  const colDef=[
    {key:'todo',     label:'📌 À faire',      color:'var(--border)'},
    {key:'inprogress',label:'⚡ En cours',   color:'rgba(91,140,255,.25)'},
    {key:'done',     label:'✅ Terminé',      color:'rgba(53,208,143,.2)'},
  ];
  document.getElementById('boardCols').innerHTML=colDef.map(c=>`
    <div style="background:var(--p2);border:1px solid ${c.color};border-radius:11px;padding:12px">
      <div style="font-size:12px;font-weight:600;margin-bottom:10px;color:var(--dim)">${c.label} (${cols[c.key].length})</div>
      ${cols[c.key].length?cols[c.key].map(t=>`
        <div style="background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:7px;font-size:12.5px">
          <div style="font-weight:500;line-height:1.4">${esc(t.title)}</div>
          <div style="margin-top:5px;display:flex;gap:5px;align-items:center">
            <span class="badge ${PRIO_CLS[t.prio]}">${PRIO_LBL[t.prio]}</span>
            <span style="font-size:11px;color:var(--dim)">${NAMES[t.assign]||''}</span>
          </div>
        </div>`).join(''):'<div style="font-size:12px;color:var(--dim);text-align:center;padding:14px 0">Vide</div>'}
    </div>`).join('');
}

function updateKPIs(){
  const total=state.tasks.length;
  const done=state.tasks.filter(t=>t.done).length;
  const pending=total-done;
  const pass=state.tests.filter(t=>t.result==='pass').length;
  const tested=state.tests.filter(t=>t.result!=='pending').length;
  document.getElementById('kpiTotal').textContent=total;
  document.getElementById('kpiDone').textContent=done;
  document.getElementById('kpiPending').textContent=pending;
  document.getElementById('kpiPassRate').textContent=tested?Math.round(pass/tested*100)+'%':'—';
}

function renderAll(){updateKPIs();renderTasks();renderTests();renderSprint();}

function addTask(){
  const title=document.getElementById('addTitle').value.trim();
  if(!title)return;
  const id=Date.now();
  state.tasks.push({
    id,title,
    prio:document.getElementById('addPrio').value,
    assign:document.getElementById('addAssign').value,
    done:false
  });
  document.getElementById('addTitle').value='';
  save(); renderAll();
}
function toggleTask(id){
  const t=state.tasks.find(x=>x.id===id);
  if(t){t.done=!t.done; save(); renderAll();}
}
function deleteTask(id){
  state.tasks=state.tasks.filter(x=>x.id!==id);
  save(); renderAll();
}
function addTest(){
  const name=document.getElementById('addTestName').value.trim();
  if(!name)return;
  const n=state.tests.length+1;
  state.tests.push({
    id:'TC-'+String(n).padStart(2,'0'),
    name,
    module:document.getElementById('addTestMod').value,
    result:'pending'
  });
  document.getElementById('addTestName').value='';
  save(); renderAll();
}
function setTestResult(idx,val){
  state.tests[idx].result=val;
  save(); renderAll();
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

renderAll();
document.getElementById('addTitle').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});
document.getElementById('addTestName').addEventListener('keydown',e=>{if(e.key==='Enter')addTest();});
</script>
</body>
</html>
