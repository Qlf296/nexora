<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Inditex — Utrecht Logistics Hub</title>
<style>
:root{
  --bg:#0b0f17;--panel:#111726;--p2:#0f1420;
  --border:#1e2840;--text:#e7ebf3;--dim:#6b7693;
  --accent:#5b8cff;--free:#35d08f;--pro:#ff9f43;--danger:#ff5a6e;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.nav{display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10}
.nav-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.nav-dot{width:9px;height:9px;border-radius:50%;background:var(--pro);
  box-shadow:0 0 8px var(--pro)}
.nav-back{color:var(--dim);font-size:12px;text-decoration:none;
  padding:5px 11px;border:1px solid var(--border);border-radius:8px;
  transition:color .15s,border-color .15s}
.nav-back:hover{color:var(--text);border-color:var(--accent)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 20px 40px}
h2{font-size:15px;font-weight:600;margin-bottom:14px;color:var(--text)}
.section{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:18px;margin-bottom:16px}

/* KPI row */
.kpi-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.kpi{flex:1;min-width:140px;background:var(--p2);border:1px solid var(--border);
  border-radius:var(--r);padding:14px 16px}
.kpi-val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi-lbl{font-size:11px;color:var(--dim);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.green{color:var(--free)}.orange{color:var(--pro)}.red{color:var(--danger)}.blue{color:var(--accent)}

/* Week grid */
.week-grid{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--p2);color:var(--dim);font-weight:600;text-transform:uppercase;
  letter-spacing:.4px;font-size:11px;padding:8px 10px;border-bottom:1px solid var(--border);
  text-align:center;white-space:nowrap}
th:first-child{text-align:left}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.name-cell{display:flex;align-items:center;gap:8px}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.slot{display:inline-flex;align-items:center;justify-content:center;
  width:100%;padding:5px 4px;border-radius:7px;font-size:11.5px;font-weight:600;
  cursor:pointer;border:none;transition:opacity .15s;white-space:nowrap}
.slot:hover{opacity:.8}
.slot-present{background:rgba(53,208,143,.15);color:var(--free);border:1px solid rgba(53,208,143,.3)}
.slot-remote {background:rgba(91,140,255,.13);color:var(--accent);border:1px solid rgba(91,140,255,.3)}
.slot-absent {background:rgba(255,90,110,.12);color:var(--danger);border:1px solid rgba(255,90,110,.25)}
.slot-conge  {background:rgba(255,159,67,.12);color:var(--pro);border:1px solid rgba(255,159,67,.25)}
.slot-lock   {background:rgba(255,255,255,.04);color:var(--dim);border:1px solid var(--border);cursor:default}

/* Logs */
.log{font-size:12px;color:var(--dim);border-top:1px solid var(--border);padding-top:12px;margin-top:12px;
  display:flex;flex-direction:column;gap:4px;max-height:120px;overflow-y:auto}
.log-item{display:flex;gap:10px}
.log-time{color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.log-msg{color:var(--text)}

/* Controls */
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.btn{padding:7px 14px;border-radius:9px;border:1px solid var(--border);
  background:var(--p2);color:var(--text);font-size:12.5px;font-family:inherit;
  cursor:pointer;transition:border-color .15s,color .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn-primary:hover{opacity:.88;color:#fff}

.week-label{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.3px}
.badge{font-size:10px;padding:2px 7px;border-radius:999px;font-weight:600;
  text-transform:uppercase;letter-spacing:.3px}
.badge-ok{background:rgba(53,208,143,.12);color:var(--free);border:1px solid rgba(53,208,143,.25)}
.badge-warn{background:rgba(255,159,67,.12);color:var(--pro);border:1px solid rgba(255,159,67,.25)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:22px;max-width:380px;width:100%}
.modal h3{font-size:14px;font-weight:600;margin-bottom:14px}
.modal label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px;margin-top:10px}
.modal select,.modal textarea{width:100%;background:var(--p2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px;font-family:inherit}
.modal textarea{resize:vertical;min-height:60px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
[hidden]{display:none!important}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">
    <span class="nav-dot"></span>
    Inditex — Utrecht Logistics Hub
  </div>
  <a class="nav-back" href="javascript:history.back()">← NEXORA</a>
</nav>

<div class="wrap">

  <!-- KPIs -->
  <div class="kpi-row">
    <div class="kpi"><div class="kpi-val green" id="kpiPresent">4</div><div class="kpi-lbl">Présents cette semaine</div></div>
    <div class="kpi"><div class="kpi-val orange" id="kpiRemote">2</div><div class="kpi-lbl">En remote</div></div>
    <div class="kpi"><div class="kpi-val red" id="kpiAbsent">1</div><div class="kpi-lbl">Absents / congés</div></div>
    <div class="kpi"><div class="kpi-val blue" id="kpiCover">91%</div><div class="kpi-lbl">Couverture équipe</div></div>
  </div>

  <!-- Planning semaine -->
  <div class="section">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <h2 style="margin:0">Planning Équipe — <span class="week-label" id="weekLabel"></span></h2>
      <div style="display:flex;gap:7px;align-items:center">
        <button class="btn" onclick="prevWeek()">← Sem. préc.</button>
        <button class="btn btn-primary" onclick="goToday()">Aujourd'hui</button>
        <button class="btn" onclick="nextWeek()">Sem. suiv. →</button>
      </div>
    </div>

    <div class="week-grid">
      <table id="planTable">
        <thead id="planHead"></thead>
        <tbody id="planBody"></tbody>
      </table>
    </div>

    <div class="log" id="actLog">
      <div class="log-item"><span class="log-time">08:52</span><span class="log-msg">Planning chargé depuis le cache local</span></div>
    </div>
  </div>

  <!-- Légende -->
  <div class="section" style="padding:12px 18px">
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
      <span style="font-size:12px;color:var(--dim);font-weight:600">Légende :</span>
      <button class="slot slot-present" style="width:auto;padding:4px 10px" disabled>Présent</button>
      <button class="slot slot-remote"  style="width:auto;padding:4px 10px" disabled>Remote</button>
      <button class="slot slot-absent"  style="width:auto;padding:4px 10px" disabled>Absent</button>
      <button class="slot slot-conge"   style="width:auto;padding:4px 10px" disabled>Congé</button>
      <button class="slot slot-lock"    style="width:auto;padding:4px 10px" disabled>Verrouillé</button>
      <span style="font-size:11.5px;color:var(--dim);margin-left:4px">Clic sur une case pour modifier</span>
    </div>
  </div>

</div>

<!-- Modal édition -->
<div class="overlay" id="editModal" hidden>
  <div class="modal">
    <h3 id="modalTitle">Modifier le statut</h3>
    <label>Statut</label>
    <select id="modalStatus">
      <option value="present">Présent</option>
      <option value="remote">Remote</option>
      <option value="absent">Absent</option>
      <option value="conge">Congé</option>
      <option value="lock">Verrouillé</option>
    </select>
    <label>Note (optionnel)</label>
    <textarea id="modalNote" placeholder="Ex: réunion direction, formation…"></textarea>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveSlot()">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const TEAM = [
  {id:'FA',name:'Fatima Al-Rashid',bg:'rgba(91,140,255,.18)',fg:'var(--accent)'},
  {id:'LV',name:'Lars van der Berg',bg:'rgba(53,208,143,.15)',fg:'var(--free)'},
  {id:'PS',name:'Priya Sharma',      bg:'rgba(255,159,67,.15)',fg:'var(--pro)'},
  {id:'DK',name:'Daan Kowalski',     bg:'rgba(91,140,255,.13)',fg:'var(--accent)'},
  {id:'MJ',name:'Mia Jansen',        bg:'rgba(255,90,110,.12)',fg:'var(--danger)'},
];
const DAYS = ['Lun','Mar','Mer','Jeu','Ven'];
const KEY  = 'nexora_utrecht_v2';

let weekOffset = 0;
let data = {};
let editTarget = null;

try { data = JSON.parse(localStorage.getItem(KEY)||'{}'); } catch(e){}

function weekStart(offset){
  const d=new Date(); d.setHours(0,0,0,0);
  const dow=d.getDay()||7; d.setDate(d.getDate()-dow+1+offset*7);
  return d;
}
function fmt(d){return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});}

function slotKey(memberId,dayIdx){
  const ws=weekStart(weekOffset);
  const d=new Date(ws); d.setDate(d.getDate()+dayIdx);
  return memberId+'_'+d.toISOString().slice(0,10);
}
function defaultStatus(memberId,dayIdx){
  const defaults={
    'FA':[0,0,0,0,1],'LV':[1,0,0,1,0],'PS':[1,1,1,1,1],
    'DK':[0,0,2,3,3],'MJ':[0,0,0,2,2]
  };
  const v=(defaults[memberId]||[])[dayIdx]||0;
  return ['present','present','remote','absent','conge'][v]||'present';
}
function getSlot(memberId,dayIdx){
  return data[slotKey(memberId,dayIdx)]||{status:defaultStatus(memberId,dayIdx),note:''};
}

const CSS={present:'slot-present',remote:'slot-remote',absent:'slot-absent',conge:'slot-conge',lock:'slot-lock'};
const LBL={present:'Présent',remote:'Remote',absent:'Absent',conge:'Congé',lock:'🔒'};

function render(){
  const ws=weekStart(weekOffset);
  const we=new Date(ws); we.setDate(we.getDate()+4);
  document.getElementById('weekLabel').textContent=
    'Semaine du '+fmt(ws)+' au '+fmt(we)+(weekOffset===0?' (courante)':'');

  // header
  const th=document.getElementById('planHead');
  let hrow='<tr><th>Collaborateur</th>';
  for(let i=0;i<5;i++){
    const d=new Date(ws); d.setDate(d.getDate()+i);
    const isToday=weekOffset===0&&d.toDateString()===new Date().toDateString();
    hrow+=`<th style="${isToday?'color:var(--accent)':''}">
      ${DAYS[i]}<br><span style="font-size:10px;font-weight:400">${fmt(d)}</span>
    </th>`;
  }
  th.innerHTML=hrow+'</tr>';

  // body
  const tb=document.getElementById('planBody');
  tb.innerHTML=TEAM.map(m=>{
    let row=`<tr>
      <td><div class="name-cell">
        <div class="avatar" style="background:${m.bg};color:${m.fg}">${m.id}</div>
        <span style="font-weight:500">${m.name}</span>
      </div></td>`;
    for(let i=0;i<5;i++){
      const s=getSlot(m.id,i);
      const cls=CSS[s.status]||'slot-present';
      const lbl=LBL[s.status]||s.status;
      const lock=s.status==='lock';
      row+=`<td><button class="slot ${cls}" title="${s.note||lbl}"
        ${lock?'disabled':''}
        onclick="openEdit('${m.id}',${i},'${m.name}')">${lbl}</button></td>`;
    }
    return row+'</tr>';
  }).join('');

  updateKPIs();
}

function updateKPIs(){
  let present=0,remote=0,absent=0,total=0;
  TEAM.forEach(m=>{ for(let i=0;i<5;i++){
    const s=getSlot(m.id,i).status; total++;
    if(s==='present')present++;
    else if(s==='remote')remote++;
    else if(s==='absent'||s==='conge')absent++;
  }});
  document.getElementById('kpiPresent').textContent=present;
  document.getElementById('kpiRemote').textContent=remote;
  document.getElementById('kpiAbsent').textContent=absent;
  document.getElementById('kpiCover').textContent=Math.round((present+remote)/total*100)+'%';
}

function openEdit(memberId,dayIdx,name){
  const s=getSlot(memberId,dayIdx);
  editTarget={memberId,dayIdx};
  document.getElementById('modalTitle').textContent='Modifier : '+name+' — '+DAYS[dayIdx];
  document.getElementById('modalStatus').value=s.status;
  document.getElementById('modalNote').value=s.note||'';
  document.getElementById('editModal').hidden=false;
}
function closeModal(){document.getElementById('editModal').hidden=true;editTarget=null;}
function saveSlot(){
  if(!editTarget)return;
  const status=document.getElementById('modalStatus').value;
  const note=document.getElementById('modalNote').value.trim();
  const k=slotKey(editTarget.memberId,editTarget.dayIdx);
  data[k]={status,note};
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  addLog('Statut mis à jour : '+TEAM.find(m=>m.id===editTarget.memberId).name+' → '+LBL[status]);
  closeModal(); render();
}
function addLog(msg){
  const log=document.getElementById('actLog');
  const now=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  const item=document.createElement('div'); item.className='log-item';
  item.innerHTML=`<span class="log-time">${now}</span><span class="log-msg">${msg}</span>`;
  log.prepend(item);
}
function prevWeek(){weekOffset--;render();}
function nextWeek(){weekOffset++;render();}
function goToday(){weekOffset=0;render();}

document.getElementById('editModal').addEventListener('click',function(e){
  if(e.target===this)closeModal();
});

render();
</script>
</body>
</html>
